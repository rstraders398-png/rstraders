<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Ledger Card Container -->
  <rect x="56" y="76" width="400" height="360" rx="32" fill="#1e293b" stroke="#334155" stroke-width="4" />

  <!-- Card Top Banner -->
  <path d="M 56 108 C 56 90.3 70.3 76 88 76 L 424 76 C 441.7 76 456 90.3 456 108 L 456 148 L 56 148 Z" fill="url(#primary)" />

  <!-- Decorative App Title / Header Dots -->
  <circle cx="96" cy="112" r="8" fill="#93c5fd" />
  <circle cx="124" cy="112" r="8" fill="#93c5fd" opacity="0.7" />
  <circle cx="152" cy="112" r="8" fill="#93c5fd" opacity="0.4" />

  <!-- Accounting Ledger Grid Lines -->
  <line x1="96" y1="190" x2="416" y2="190" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <line x1="96" y1="236" x2="416" y2="236" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <line x1="96" y1="282" x2="416" y2="282" stroke="#334155" stroke-width="3" stroke-linecap="round" />

  <!-- Cheque Instrument & Badge Overlay -->
  <g transform="translate(86, 210)">
    <!-- Cheque Sheet -->
    <rect width="340" height="180" rx="18" fill="#0f172a" stroke="url(#accent)" stroke-width="4" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))" />
    
    <!-- Cheque Header Details -->
    <rect x="24" y="24" width="130" height="12" rx="6" fill="#64748b" />
    <rect x="230" y="24" width="86" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2" />
    
    <!-- Cheque Payee line -->
    <text x="24" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">PAY</text>
    <line x1="60" y1="74" x2="316" y2="74" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Rupee / Amount Box -->
    <rect x="200" y="96" width="116" height="42" rx="8" fill="url(#accent)" opacity="0.15" />
    <rect x="200" y="96" width="116" height="42" rx="8" fill="none" stroke="url(#accent)" stroke-width="2" />
    <text x="214" y="123" fill="#10b981" font-family="monospace, monospace" font-size="18" font-weight="bold">Rs. ERP</text>

    <!-- MICR / Security Code Strip -->
    <rect x="24" y="152" width="180" height="8" rx="4" fill="#334155" />
    
    <!-- Golden Seal Shield -->
    <g transform="translate(136, 92)">
      <circle cx="16" cy="16" r="22" fill="url(#gold)" />
      <path d="M 16 4 L 28 10 L 28 20 C 28 26.5 22.8 32.5 16 34 C 9.2 32.5 4 26.5 4 20 L 4 10 Z" fill="#78350f" opacity="0.2" />
      <path d="M 10 16 L 14 20 L 22 11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
