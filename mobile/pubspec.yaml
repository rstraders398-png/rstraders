name: chequedesk_mobile
description: "Enterprise Cheque Register & Ledger Mobile Application with Multi-Tenant Biometrics, Dynamic Sales Matrix, and Offline-First Auto-Sync"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Native Biometrics & Secure Storage
  local_auth: ^2.1.8
  local_auth_android: ^1.0.35
  local_auth_darwin: ^1.2.2
  flutter_secure_storage: ^9.0.0

  # Offline Storage (Ultra-fast NoSQL KV & Object Store)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking & Connectivity
  dio: ^5.4.1
  connectivity_plus: ^5.0.2

  # File Manager, Pickers & Shares
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  share_plus: ^7.2.2

  # Utilities & Date Systems (BS / AD)
  intl: ^0.19.0
  nepali_utils: ^3.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
